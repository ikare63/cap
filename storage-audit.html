<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>CAP — Audit du stockage</title>
  <style>
    :root{
      font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:#2b2521;background:#fff9f4;
    }
    *{box-sizing:border-box}
    body{margin:0;padding:20px;max-width:760px;margin-inline:auto}
    h1{font-size:1.7rem;margin:0 0 8px}
    p{line-height:1.45}
    .card{background:#fff;border:1px solid #eadfd6;border-radius:18px;padding:16px;margin:14px 0}
    .big{font-size:1.45rem;font-weight:800}
    .warn{background:#fff1e8;border-color:#ffb98a}
    .ok{background:#eff9ef;border-color:#b8dfb8}
    table{width:100%;border-collapse:collapse;font-size:.92rem}
    th,td{text-align:left;padding:10px 7px;border-bottom:1px solid #eee2da;vertical-align:top}
    th:nth-child(2),td:nth-child(2){text-align:right;white-space:nowrap}
    code{font-size:.85em;word-break:break-all}
    .tag{display:inline-block;font-size:.73rem;padding:3px 7px;border-radius:999px;background:#f1ece8;margin-top:4px}
    button{border:0;border-radius:12px;padding:12px 15px;font-weight:700;background:#ff6a1a;color:white;font-size:1rem}
    .small{font-size:.85rem;color:#766c65}
  </style>
</head>
<body>
  <h1>Audit du stockage local</h1>
  <p>Cette page <strong>ne supprime et ne modifie rien</strong>. Elle mesure uniquement les clés stockées sur <code>ikare63.github.io</code>.</p>

  <section id="summary" class="card"></section>

  <section class="card">
    <h2 style="margin-top:0">Clés les plus lourdes</h2>
    <table>
      <thead><tr><th>Clé</th><th>Taille approx.</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>

  <section class="card">
    <button id="copy">Copier le rapport</button>
    <p class="small">Tu peux aussi simplement faire une capture de cette page et l’envoyer dans ChatGPT.</p>
  </section>

<script>
(function(){
  const classify = key => {
    if (key === 'cap-data') return 'Données CAP — à conserver';
    if (key === 'lenaic-search-index-v1') return 'Index de recherche dérivé';
    if (key === 'lenaic-bus-v1') return 'Ancien miroir du BUS';
    if (key === 'lenaic-bus-v2') return 'BUS actuel';
    if (key === 'lenaic-notifications-v1') return 'Notifications écosystème';
    if (key === 'lenaic-genealogy-context-v1') return 'Contexte généalogique';
    if (key === 'lenaic-modules-v1') return 'État des modules';
    if (key === 'pistoria_private_v3') return 'Données Pistoria — à conserver';
    if (key === 'memoire-famille-data') return 'Données Arboris — à conserver';
    if (key === 'scriptoria-data') return 'Données Scriptoria — à conserver';
    if (key === 'ariane-local-v2') return 'Données Ariane — à conserver';
    if (key === 'scribe-local-v3') return 'Données Scribe — à conserver';
    if (key.startsWith('culina-')) return 'Données Culina';
    return 'Autre';
  };

  // localStorage est généralement compté en caractères UTF-16.
  const approxBytes = (s) => (s ? s.length * 2 : 0);
  const fmt = b => b >= 1024*1024
    ? (b/1024/1024).toFixed(2) + ' Mo'
    : (b/1024).toFixed(1) + ' Ko';

  const items = [];
  let total = 0;
  for (let i=0;i<localStorage.length;i++){
    const key = localStorage.key(i);
    const value = localStorage.getItem(key) || '';
    const bytes = approxBytes(key) + approxBytes(value);
    total += bytes;
    items.push({key, bytes, kind: classify(key)});
  }
  items.sort((a,b)=>b.bytes-a.bytes);

  const pct = Math.min(999, total / (10*1024*1024) * 100);
  const summary = document.getElementById('summary');
  summary.className = 'card ' + (pct > 90 ? 'warn' : 'ok');
  summary.innerHTML =
    '<div class="big">' + fmt(total) + ' utilisés</div>' +
    '<div>≈ ' + pct.toFixed(1) + ' % d’un quota de 10 Mo</div>' +
    '<div class="small">' + items.length + ' clés présentes · estimation UTF‑16</div>';

  const tbody = document.getElementById('rows');
  items.forEach(x=>{
    const tr=document.createElement('tr');
    const td1=document.createElement('td');
    const code=document.createElement('code'); code.textContent=x.key;
    const tag=document.createElement('div'); tag.className='tag'; tag.textContent=x.kind;
    td1.append(code, document.createElement('br'), tag);
    const td2=document.createElement('td'); td2.textContent=fmt(x.bytes);
    tr.append(td1,td2); tbody.appendChild(tr);
  });

  const report = [
    'AUDIT LOCALSTORAGE ikare63.github.io',
    'Total approx.: '+fmt(total),
    'Clés: '+items.length,
    '',
    ...items.map(x => `${x.key}: ${fmt(x.bytes)} — ${x.kind}`)
  ].join('\n');

  document.getElementById('copy').onclick = async () => {
    try {
      await navigator.clipboard.writeText(report);
      document.getElementById('copy').textContent='Rapport copié ✓';
    } catch(e) {
      alert(report);
    }
  };
})();
</script>
</body>
</html>
