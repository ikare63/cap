<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cap — Zone secrète</title>
<link rel="icon" type="image/svg+xml" href="assets/logo-cap.svg">
<style>
:root{--bg:#f4f7fb;--panel:#fff;--text:#111827;--muted:#667085;--line:#dde5ef;--orange:#ff6a1b}
body.dark{--bg:#031225;--panel:#081b31;--text:#eef4ff;--muted:#a7b6c9;--line:#173861;--orange:#ff7f2f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,rgba(255,106,27,.12),transparent 30%),var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--text)}
.card{width:min(620px,100%);background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:34px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.15)}
.logo{width:92px;margin:auto}.eyebrow{display:block;color:var(--orange);font-weight:900;letter-spacing:.14em;text-transform:uppercase;font-size:.75rem;margin:18px 0 10px}h1{font-size:clamp(2rem,7vw,4rem);margin:0 0 12px}p{color:var(--muted);line-height:1.6}.btn{display:inline-block;margin-top:18px;padding:13px 18px;border-radius:16px;background:linear-gradient(135deg,var(--orange),#ff934a);color:#fff;text-decoration:none;font-weight:900}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="assets/logo-cap.svg" alt="Cap">
  <span class="eyebrow">Zone secrète</span>
  <h1>Tu l’as trouvée.</h1>
  <p>L’accès caché de Cap fonctionne toujours. Cette page est fournie comme repli dans le pack GitHub, car l’ancienne version faisait déjà référence à <code>secret.html</code>.</p>
  <a class="btn" href="index.html">Retour à Cap</a>
</div>
<script>if(localStorage.getItem('cap-dark')==='1')document.body.classList.add('dark')</script>
</body>
</html>
